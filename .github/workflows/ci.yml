name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
          - name: Ubuntu x64
            os: ubuntu-24.04
          - name: Ubuntu arm64
            os: ubuntu-24.04-arm
          - name: Windows x64
            os: windows-latest
          - name: Windows ARM64
            os: windows-11-arm
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      LOCKSTEP_CACHE: ${{ github.workspace }}/.lockstep-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache/restore@v4
        id: lockstep-cache
        with:
          path: .lockstep-cache
          key: lockstep-${{ matrix.os }}-${{ hashFiles('lockstep.lock', 'cmake/lockstep.cmake') }}

      # setup-just has no Windows ARM64 build; that lane calls the script just would.
      - uses: extractions/setup-just@v2
        if: matrix.os != 'windows-11-arm'

      - name: Install libcurl headers for eacp's configure
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev ninja-build

      - name: Build, test and self-check
        if: matrix.os != 'windows-11-arm'
        run: just test

      - name: Build, test and self-check
        if: matrix.os == 'windows-11-arm'
        shell: cmd
        run: scripts\test-windows.cmd

      # Saved even when a test fails, so the next run still finds the packages
      # and libraries this one built.
      - uses: actions/cache/save@v4
        if: always() && steps.lockstep-cache.outputs.cache-hit != 'true'
        with:
          path: .lockstep-cache
          key: ${{ steps.lockstep-cache.outputs.cache-primary-key }}

  codehealth:
    name: Code Health of the changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./

  action-arguments:
    name: Action runs custom arguments (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          arguments: --version
      - name: Run codehealth from PATH
        shell: bash
        run: codehealth --version
      - uses: ./
        with:
          version: v0.1.0
          arguments: --version
      - name: The pinned release is first on PATH
        shell: bash
        run: codehealth --version | tr -d "\r" | grep -Fx "codehealth 0.1.0"

  action-without-earlier-commit:
    name: Action compares with the default branch when the event names no earlier commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          fail-on: never
      - name: Check with the before-sha a new branch's first push sends
        shell: bash
        run: '"$GITHUB_WORKSPACE/action/check.sh"'
        env:
          CODEHEALTH_BINARY: codehealth
          CODEHEALTH_FAIL_ON: never
          PUSH_BEFORE_SHA: "0000000000000000000000000000000000000000"
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
